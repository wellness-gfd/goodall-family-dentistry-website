# Netlify settings for goodallfamilydentistry.com
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # PRE-LAUNCH ONLY: keeps every page out of Google while the team reviews the test site.
    # Delete this line when goodallfamilydentistry.com is connected.
    X-Robots-Tag = "noindex"

# Long browser caching for photos and videos (they rarely change)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
